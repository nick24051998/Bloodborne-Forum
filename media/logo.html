<!doctype html>
<!-- Logo für Forum-Kopfzeile und Website (theme/logo.png, website/public/logo.png).
     Neu erzeugen: node media/render-logo.cjs (nach python3 media/brand.py). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cinzel; font-weight: 700; src: url("../website/public/fonts/cinzel-latin-700-normal.woff2"); }
  @font-face { font-family: Cinzel; font-weight: 600; src: url("../website/public/fonts/cinzel-latin-600-normal.woff2"); }
  html, body { margin: 0; background: transparent; }
  /* 3-fache Größe: wird im Forum mit 40 px Höhe angezeigt */
  .logo { display: inline-flex; align-items: center; gap: 22px; height: 120px; padding: 0 6px 0 0; }
  .logo img { width: 112px; height: 112px; }
  .text { display: flex; flex-direction: column; align-items: center; }
  .name { font: 700 50px/1 Cinzel, serif; letter-spacing: 0.06em; color: #ece7dd; }
  .sub { display: flex; align-items: center; gap: 12px; margin-top: 10px;
         font: 600 17px/1 Cinzel, serif; letter-spacing: 0.32em; color: #c2a878; }
  .sub::before, .sub::after { content: ""; width: 34px; height: 2px; background: #9c8458; }
</style>
</head>
<body>
  <div class="logo">
    <img src="brand/server-icon-round.png" alt="">
    <div class="text">
      <div class="name">BLOODBORNE</div>
      <div class="sub">PC PORT COMMUNITY</div>
    </div>
  </div>
</body>
</html>
