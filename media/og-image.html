<!doctype html>
<!-- Vorschaubild für geteilte Links (website/public/og-image.jpg, 1200x630).
     Neu erzeugen: diese Datei im Browser bei 1200x630 öffnen und als JPEG speichern
     (oder: node media/render-og.cjs). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cinzel; font-weight: 700; src: url("../website/public/fonts/cinzel-latin-700-normal.woff2"); }
  @font-face { font-family: Inter; font-weight: 500; src: url("../website/public/fonts/inter-latin-500-normal.woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0d0e10; }
  .card {
    position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 0 0 0 80px;
    display: flex; flex-direction: column; justify-content: center;
    background:
      linear-gradient(90deg, rgba(8, 9, 10, 0.92) 0%, rgba(8, 9, 10, 0.55) 38%, transparent 60%),
      url("images/og-background.jpg") right center / cover no-repeat;
  }
  h1 { margin: 0; font: 700 74px/1.08 Cinzel, serif; letter-spacing: 0.03em; color: #ece7dd;
       text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9); }
  .line { width: 120px; height: 2px; margin: 28px 0 22px; background: linear-gradient(90deg, #9c8458, transparent); }
  p { margin: 0; font: 500 30px/1.3 Inter, sans-serif; color: #c2a878; }
</style>
</head>
<body>
  <div class="card">
    <h1>Bloodborne<br>PC Port</h1>
    <div class="line"></div>
    <p>Install guide · FAQ · Community</p>
  </div>
</body>
</html>
