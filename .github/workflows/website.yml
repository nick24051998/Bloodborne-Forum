# Baut die Website (website/) und veröffentlicht sie auf GitHub Pages.
# Einmalig aktivieren: Repo → Settings → Pages → Source: "GitHub Actions".
#
# Alle 2 Stunden schaut der Workflow nach einer neuen Version des Ports (GitHub-Releases, Repo aus
# SITE.downloadUrl). Gibt es eine, baut er die Website neu (Version, Download, Changelog-Liste) und meldet
# sie in Discord, wenn das Secret DISCORD_RELEASES_WEBHOOK gesetzt ist (Repo → Settings → Secrets and
# variables → Actions; Webhook-URL eines Discord-Kanals, z. B. #announcements).
#
# Vor jedem Deploy prüft Playwright die fertige Seite im Browser (website/tests). Schlägt eine Prüfung fehl,
# bricht der Build ab und nichts geht live. Pull Requests und Branches „ci/…“ werden nur gebaut und geprüft.
name: Website

on:
  push:
    branches: [main, "ci/**"]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nicht abbrechen: sonst ginge die Discord-Meldung eines laufenden Durchgangs verloren
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  releases:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      announce: ${{ steps.check.outputs.announce }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: website
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - id: check
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-releases.mjs --check

  build:
    needs: releases
    # Nach Zeitplan nur bauen, wenn GitHub eine andere Version hat als die Website
    if: github.event_name != 'schedule' || needs.releases.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Frische Releases; ist GitHub nicht erreichbar, baut die Website mit dem Stand aus dem Repo
      - run: node scripts/fetch-releases.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
      # Prüfungen im echten Browser (Chromium, Desktop und Handy) gegen die gebaute Seite
      - name: Playwright installieren
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Website prüfen
        run: npx playwright test
      - name: Bericht bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ergebnisse
          path: website/test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    # Live geht nur main; Pull Requests und ci/-Branches werden nur geprüft
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  announce:
    needs: [releases, deploy]
    if: needs.releases.outputs.announce == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: website
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: node scripts/fetch-releases.mjs --announce
