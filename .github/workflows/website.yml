# Builds the website (website/) and publishes it to GitHub Pages.
# Enable once: Repo → Settings → Pages → Source: "GitHub Actions".
#
# Every 2 hours the workflow checks for a new version of the port (GitHub releases, repo taken from
# SITE.downloadUrl). If there is one, it rebuilds the website (version, download, changelog list) and announces
# it in Discord if the secret DISCORD_RELEASES_WEBHOOK is set (Repo → Settings → Secrets and
# variables → Actions; webhook URL of a Discord channel, e.g. #announcements).
#
# Before every deploy, Playwright checks the finished site in the browser (website/tests). If a check fails,
# the build aborts and nothing goes live. Pull requests and "ci/…" branches are only built and checked.
name: Website

on:
  push:
    branches: [main, "ci/**"]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel: otherwise the Discord announcement of a running run would be lost
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  releases:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      announce: ${{ steps.check.outputs.announce }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: website
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - id: check
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-releases.mjs --check

  build:
    needs: releases
    # On the schedule, only build if GitHub has a different version than the website
    if: github.event_name != 'schedule' || needs.releases.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Fresh releases; if GitHub is unreachable, the website is built with the state from the repo
      - run: node scripts/fetch-releases.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
      # Checks in a real browser (Chromium, desktop and phone) against the built site
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Test the website
        run: npx playwright test
      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: website/test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    # Only main goes live; pull requests and ci/ branches are only checked
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  announce:
    needs: [releases, deploy]
    if: needs.releases.outputs.announce == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: website
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: node scripts/fetch-releases.mjs --announce
