# Outage watchdog: every 10 minutes it checks whether the website and forum respond (scripts/uptime-check.sh).
# Reports only changes to Discord (down / back up) if the secret DISCORD_STATUS_WEBHOOK is set
# (Repo → Settings → Secrets and variables → Actions; webhook URL of a Discord channel, e.g. for admins).
# The last state is kept in the Actions cache; runs stay green so that GitHub doesn't send an email per run.
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/cache/restore@v4
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-
      - id: check
        name: Check website and forum
        env:
          WEBSITE_URL: https://bbport.de/
          FORUM_URL: https://forum.bbport.de
          DISCORD_STATUS_WEBHOOK: ${{ secrets.DISCORD_STATUS_WEBHOOK }}
        run: bash scripts/uptime-check.sh
      # Save only on a change; the most recent entry is the current state
      - if: steps.check.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}
