# Bloodborne PC Port Community Forum
# Flarum 1.8 (crazymax/flarum) + MariaDB 10.11
#
#   cp .env.example .env   # fill in the values
#   docker compose up -d
#
# Flarum only listens on 127.0.0.1:${FLARUM_PORT} – HTTPS is handled by the reverse proxy
# (Caddy) or Cloudflare Tunnel (see README).

name: bloodborne-forum

x-flarum-env: &flarum-env
  TZ: ${TZ:-Europe/Berlin}
  FLARUM_BASE_URL: ${FORUM_URL:?FORUM_URL fehlt in .env}
  FLARUM_FORUM_TITLE: ${FORUM_TITLE:-Bloodborne PC Port Community}
  FLARUM_POWEREDBY_HEADER: "false"
  DB_HOST: db
  DB_NAME: ${DB_NAME:-flarum}
  DB_USER: ${DB_USER:-flarum}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
  MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
  UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-32M}
  # Real visitor IP behind Caddy/cloudflared (Cloudflare sets CF-Connecting-IP).
  # The header is only trusted from the forum's own network (see networks below).
  REAL_IP_FROM: ${FORUM_SUBNET:-10.88.0.0/24}
  REAL_IP_HEADER: ${REAL_IP_HEADER:-CF-Connecting-IP}
  LISTEN_IPV6: "false"

# Hardening for all containers: no privilege escalation, log rotation
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *hardening
    image: mariadb:10.11
    restart: unless-stopped
    # When RAM runs low, let other processes be killed first (FORUM_OOM_SCORE_ADJ in .env)
    oom_score_adj: ${FORUM_OOM_SCORE_ADJ:-0}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Forum search finds short words and numbers too ("code 3", "code 23"); the default 3 skipped them, so both
      # searches gave the same results (UX review 29.10.2026). After a change, rebuild the FULLTEXT indexes
      # flarum_posts.content and flarum_discussions.title (drop and add); a restored dump builds them anew anyway.
      - --innodb-ft-min-token-size=1
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD fehlt in .env}
      MARIADB_DATABASE: ${DB_NAME:-flarum}
      MARIADB_USER: ${DB_USER:-flarum}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  flarum:
    <<: *hardening
    image: crazymax/flarum:${FLARUM_IMAGE_TAG:-1.8.19}
    restart: unless-stopped
    oom_score_adj: ${FORUM_OOM_SCORE_ADJ:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${FLARUM_BIND:-127.0.0.1}:${FLARUM_PORT:-8888}:8000"
    environment: *flarum-env
    volumes:
      - flarum-data:/data
      # Discord-only sign-up, security headers, live numbers (flarum/extend.php; the loader
      # reads it via /bbforum so changes take effect after git pull without a restart)
      - ./flarum/extend-loader.php:/opt/flarum/extend.php:ro
      # Extension list from the repo, restored before every start
      - ./flarum:/bbforum:ro
      - ./flarum/restore-extensions.sh:/etc/cont-init.d/02-zz-bbforum-extensions.sh
      # Flarum scheduler (every minute) in the same container where the extensions are installed
      - ./flarum/scheduler.sh:/etc/cont-init.d/05-zz-bbforum-scheduler.sh
      # BB Report Tool knowledge, signed by BB Helper's publisher on this host (forum.bbport.de/tool/knowledge.json,
      # mirrored to bbport.de/tool/ by the website build). Empty until the publisher has run.
      - ./tool-public:/opt/flarum/public/tool:ro

  # Option (b): Cloudflare Tunnel instead of Caddy. Only starts with the profile
  # "tunnel" (COMPOSE_PROFILES=tunnel in .env, set by scripts/bootstrap.sh).
  # Only enable it after scripts/setup-forum.sh has run. In the Cloudflare
  # dashboard, enter http://flarum:8000 as the service.
  cloudflared:
    <<: *hardening
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - flarum

# Fixed network of our own: requests from the host proxy (via the gateway) and from
# cloudflared come from this range; only they are trusted for CF-Connecting-IP.
networks:
  default:
    ipam:
      config:
        - subnet: ${FORUM_SUBNET:-10.88.0.0/24}

volumes:
  db-data:
  flarum-data:
